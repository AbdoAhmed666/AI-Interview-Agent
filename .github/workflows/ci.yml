name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_interview_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ai_interview_agent
      SECRET_KEY: ci-secret-key-not-for-production-0123456789abcdef0123456789
      ALGORITHM: HS256
      LLM_PROVIDER: mock
      # Keep the embedding-model integration scripts offline so they skip
      # deterministically instead of downloading ~130MB on every run.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply database migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Run tests
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    # The backend image pulls torch and bakes the embedding model, so this is
    # the slow job. Gate it on PRs and main rather than every feature push.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    env:
      SECRET_KEY: ci-secret-key-not-for-production-0123456789abcdef0123456789
      # Matches the tags built below, so `compose up` reuses those images
      # rather than building everything again.
      IMAGE_TAG: ci

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: ai-interview-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: ai-interview-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # Proves the images actually run together: migrations applied, the API
      # healthy, and the UI served - not merely that the Dockerfiles build.
      - name: Start the stack
        run: docker compose up -d --wait --wait-timeout 300

      - name: Check the API and the UI respond
        run: |
          curl --fail --silent --show-error http://localhost:8000/health
          curl --fail --silent --show-error --output /dev/null http://localhost:3000/login

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down --volumes
